<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title> <!-- Title removed for no title display -->
    <style>
        /* Basic styles for the body and video */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Prevent scrollbars */
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Maintain aspect ratio */
        }
    </style>
</head>
<body>

    <video id="video" autoplay muted>
        <source src="Metal Gear Solid Game Over screen [Clean background].mp4" type="video/mp4"> <!-- Replace with your video file path -->
        Your browser does not support the video tag.
    </video>

    <script>
        const video = document.getElementById('video');

        // Redirect to mainpage.html when the video ends
        video.onended = function() {
            window.location.href = '/mainpage.html/'; // Redirect to mainpage.html
        };
    </script>

</body>
</html>
