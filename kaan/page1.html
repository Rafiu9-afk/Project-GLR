<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page 1 - Main Menu</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #282c34; /* Background color */
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            display: flex;
            align-items: center; /* Center vertically */
            justify-content: space-between; /* Space out logo and buttons */
            width: 100%; /* Full width */
            max-width: 800px; /* Maximum width for the header */
            margin-bottom: 20px; /* Space below the header */
        }

        .logo img {
            width: 80%; /* Responsive logo size */
            max-width: 400px; /* Increased maximum width for the logo */
            margin: 20px;
        }

        .button {
            padding: 15px 25px;
            font-size: 18px;
            font-weight: bold;
            background-color: #61dafb; /* Button color */
            color: black;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease, color 0.3s ease; /* Added color transition */
            margin: 0 10px; /* Space between buttons */
        }

        .button:hover {
            background-color: #21a1f1; /* Darker shade on hover */
            color: white; /* Change text color on hover */
        }

        footer {
            margin-top: auto; /* Pushes footer to the bottom */
            padding: 10px;
            text-align: center;
            color: #aaa; /* Light color for footer */
        }
    </style>
</head>
<body>

    <header>
        <div class="button">
            <a href="page2.html">Page 2</a>
        </div>
        <div class="logo">
            <img src="Daco_706586.png" alt="Company Logo"> <!-- Replace with your logo -->
        </div>
        <div class="button">
            <a href="page3.html">Page 3</a>
        </div>
    </header>

    <footer>
        <p>&copy; 2024 Your Company. All rights reserved.</p>
    </footer>
    
</body>
</html>
