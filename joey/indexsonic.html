<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Start Screen</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header section with logo and stars -->
        <header>
            <div class="logo">
                <img src="logo.png" alt="Game Logo">
            </div>
            <div class="stars">
                <span class="star">★</span>
                <span class="star">★</span>
                <span class="star">★</span>
                <span class="star">★</span>
                <span class="star">★</span>
            </div>
        </header>

        <!-- Main content with start button and characters on the plane -->
        <main>
            <button id="start-btn">START GAME</button>
            <div class="plane-container">
                <img src="plane.png" alt="Plane with Characters" class="plane">
                <img src="sonic.png" alt="Character 1" class="character sonic">
                <img src="tails.png" alt="Character 2" class="character tails">
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
